name: CACHE
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  CACHE:
    type: application
    platform: iOS
    sources:
      - path: CACHE
        excludes: [Resources, ModelAssets]
      - path: CACHE/Resources
        buildPhase: resources
      - path: CACHE/ModelAssets/cache-model.gguf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cache.offlineai
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
    dependencies:
      - framework: Vendor/build-apple/llama.xcframework
        embed: false
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
    preBuildScripts:
      - name: Require bundled AI
        script: 'python3 "$SRCROOT/scripts/verify_assets.py"'
        basedOnDependencyAnalysis: false
  CACHECoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Core]
    dependencies:
      - target: CACHE
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cache.offlineai.tests
  CACHEUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: CACHE
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cache.offlineai.uitests
schemes:
  CACHE:
    build:
      targets:
        CACHE: all
        CACHECoreTests: [test]
        CACHEUITests: [test]
    test:
      gatherCoverageData: false
      targets: [CACHECoreTests, CACHEUITests]
